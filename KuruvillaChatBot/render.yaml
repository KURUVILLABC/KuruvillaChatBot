services:
  - type: web
    name: kuruvilla-chat-backend
    runtime: node
    buildCommand: npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROFILE_DISPLAY_NAME
        sync: false
      - key: PROFILE_GITHUB_USERNAME
        sync: false
      - key: GITHUB_MOCK
        value: true
      - key: LINKEDIN_MOCK
        value: true
      - key: AI_PROVIDER
        value: mock
      - key: ENABLE_SYNC
        value: true
